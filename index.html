<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ED1C24">
<title>The Great Indian Sandwich</title>
<link rel="preload" href="fonts/MomentsText-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/MomentsDisplay-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ============================================================================
   DR. OETKER BASE  +  GREAT INDIAN SANDWICH CAMPAIGN SKIN
   Architecture (spec S10 move 9): :root carries the corporate Dr. Oetker system
   verbatim. `.gis` on the app wrapper re-declares ONLY the campaign-owned
   custom properties. Delete the class and the page reverts to corporate.
   ============================================================================ */

/* ---- fonts (spec S13.2, verbatim mapping) ---- */
@font-face{font-family:"MomentsDisplay";font-style:normal;font-weight:700;font-display:swap;
  src:url("fonts/MomentsDisplay-700.woff2") format("woff2")}
@font-face{font-family:"MomentsDisplay";font-style:normal;font-weight:500;font-display:swap;
  src:url("fonts/MomentsDisplay-500.woff2") format("woff2")}
@font-face{font-family:"MomentsText";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/MomentsText-400.woff2") format("woff2")}
@font-face{font-family:"AugustScript";font-style:normal;font-weight:400;font-display:swap;
  src:url("fonts/AugustScript-400.woff2") format("woff2")}
/* metric-matched local-Arial fallbacks (spec S2.2) - stop the swap reflow */
@font-face{font-family:"MomentsDisplay Fallback";src:local("Arial");
  ascent-override:115.99%;descent-override:29.97%;line-gap-override:0%;size-adjust:82.07%}
@font-face{font-family:"MomentsText Fallback";src:local("Arial");
  ascent-override:95.64%;descent-override:24.44%;line-gap-override:0%;size-adjust:99.44%}
@font-face{font-family:"AugustScript Fallback";src:local("Arial");
  ascent-override:118.23%;descent-override:48.09%;line-gap-override:0%;size-adjust:82.97%}

/* ============ BASE: the corporate Dr. Oetker system ============ */
:root{
  --font-primary:'MomentsDisplay','MomentsDisplay Fallback',Arial,sans-serif;
  --font-neutral:'MomentsText','MomentsText Fallback',Arial,sans-serif;
  --font-secondary:'AugustScript','AugustScript Fallback',Arial,cursive;

  --primary:#A45A2A;        /* terracotta - THE interactive colour, never campaign-owned */
  --primary-ink:#FFFFFF;    /* 5.15:1 on terracotta */
  --darkgray:#292B29;       /* all body + heading text */
  --gray-500:#5A5E5A;       /* secondary text */
  --white:#FFFFFF;
  --cream:#EFDBB2;          /* hero wash + recipe card footer */
  --gold:#E1B87F;           /* alternating card footer */
  --beige:#F7E9D5;          /* footer band */
  --coolgray:#F4F5F4;       /* category card footer */
  --paper:#FDF9F4;          /* page body (bg-lightBrown). terracotta clears 4.5:1 here */
  --sage:#BBC4BA;           /* hairlines */
  --curve-line:#D4DED3;     /* curve strokes, table rules */
  --hairline:#E8EBE8;

  /* campaign hooks, neutral at base. .gis overrides these and nothing else. */
  --campaign:#A45A2A;
  --campaign-ink:#FFFFFF;
  --hero-fill:#EFDBB2;
  --hero-ink:#292B29;

  --r-card:16px; --r-pill:100px;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(0,0,.2,1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}

/* ============ SKIN: The Great Indian Sandwich ============
   Colour temperature comes from the jar. Nothing structural moves. ~70/30
   neutrals to red: red is the hero curve, the seal and the confirmation only. */
.gis{
  --campaign:#ED1C24;        /* FunFoods pack red */
  --campaign-ink:#FFFFFF;    /* 4.38:1 - LEGAL ONLY at >=19px/700. Enforced below. */
  --hero-fill:#ED1C24;
  --hero-ink:#FFFFFF;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--darkgray);
  font:400 16px/1.5 var(--font-neutral);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--cream);color:var(--darkgray)}
:root{scrollbar-color:var(--sage) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--sage);border-radius:99px;border:3px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}
input{caret-color:var(--primary)}
/* spec S11.5: terracotta focus ring, never Tailwind blue */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
:where(button,[role=button],input,label){touch-action:manipulation}
:where(button,[role=button]){cursor:pointer}
:where(button):disabled{cursor:not-allowed}
img{max-width:100%;display:block}

/* ============ shell ============ */
.app{max-width:440px;margin:0 auto;min-height:100dvh;background:var(--paper);
     display:flex;flex-direction:column;position:relative;overflow-x:clip}
/* corporate header: white, one 1px sage hairline expressed as a shadow (spec S1.5) */
.bar{position:sticky;top:0;z-index:20;background:var(--white);
     padding:calc(env(safe-area-inset-top) + 10px) var(--s4) 10px;
     display:flex;align-items:center;gap:var(--s3);
     box-shadow:var(--sage) 0 1px 0}
.bar img{width:78px;height:51px;object-fit:contain;flex:0 0 auto}
.bar b{font:400 12px/16px var(--font-neutral);letter-spacing:1.8px;text-transform:uppercase;
       color:var(--gray-500)}
main{flex:1;padding:var(--s5) var(--s4) calc(env(safe-area-inset-bottom) + 40px)}
main:has(>.hero){padding-top:0}
/* full-bleed children of main escape the 16px gutter */
.bleed{margin-inline:calc(var(--s4) * -1)}

/* ============ THE CURVE (spec S9.1) ============
   (c) clip-path for full-bleed colour/image blocks. The clipPath id is swapped
   at 768px because a fixed proportional arc reads too deep on a narrow screen. */
.curve-b{clip-path:url(#curve-mask-bottom-mobile)}
.curve-deep{clip-path:url(#curve-mask-bottom-desktop)}
@media (min-width:768px){
  .curve-b{clip-path:url(#curve-mask-bottom-desktop)}
}
/* (a) the viewBox="0 0 624 28" arc that sits on the top edge of a card footer.
   Deliberately wider than the card so its own rounded corners fall outside. */
.arc{position:absolute;bottom:99%;left:0;width:100%;height:16px;
     display:block;pointer-events:none}
.arc path{fill:var(--arcfill,var(--cream))}

/* ============ type (spec S2.3 - MomentsDisplay 700 for h1/h2 only,
   500 for card titles + control labels, MomentsText 400 for all else.
   NO weight 300, NO 600, NO bold body - those files do not exist.) ============ */
h1,h2{font-family:var(--font-primary);font-weight:700;color:var(--darkgray);margin:0 0 var(--s2);
      text-wrap:balance}
h1{font-size:28px;line-height:34px}
h2{font-size:28px;line-height:34px}
h1:focus{outline:none}
h1.display{font-size:44px;line-height:50px;margin:0 0 var(--s3)}
h1.on-hero,h2.on-hero{color:var(--hero-ink)}
@media (min-width:768px){
  h1,h2{font-size:46px;line-height:52px}
  h1.display{font-size:72px;line-height:80px}
}
/* AugustScript: exactly once per site, 72px, cream, over an image (spec S2.4) */
.august{font-family:var(--font-secondary);font-weight:400;font-size:44px;line-height:30px;
        color:var(--cream);margin:0}
@media (min-width:768px){.august{font-size:72px;line-height:72px}}

.lede{font-size:16px;line-height:24px;color:var(--darkgray);margin:0 0 var(--s5);max-width:40ch}
@media (min-width:768px){.lede{font-size:20px;line-height:30px}}
/* eyebrow / meta. spec S11.5: no opacity:.7 on anything load-bearing. */
.meta{font-size:14px;line-height:20px;letter-spacing:1.4px;text-transform:uppercase;
      color:var(--gray-500);margin:0}
.sub{font-size:16px;line-height:24px;color:var(--gray-500);margin:0}

/* ============ progress ============ */
.prog{display:flex;gap:var(--s1);padding:var(--s3) var(--s4) 0;background:var(--white)}
.prog[hidden]{display:none}
.prog i{flex:1;height:4px;border-radius:99px;background:var(--hairline);overflow:hidden;position:relative}
.prog i::after{content:"";position:absolute;inset:0;background:var(--primary);
  transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.prog i.on::after{transform:scaleX(1)}

/* ============ sandwich stack ============ */
/*
  2.5D "clay illustration" layer system. Ingredients are squashed-ellipse
  "pucks": a radial-gradient dome plus hard-edged stacked box-shadows faking an
  extruded side wall, overlapped via column-reverse + negative margins, sitting
  on a board that has its own edge thickness. No 3D transforms, no images.

  Scaling contract: the artwork is authored ONCE in a canonical 220x210 box and
  resized only by transform:scale() on .sw. box-shadow, border-radius and
  gradients all scale under a CSS transform, so the 52px thumbnail is a
  pixel-faithful copy of the hero, never a re-layout.
*/
.sw,.sw *{box-sizing:border-box}
.sw{--s:1;position:relative;width:220px;height:210px;
  flex-shrink:0;  /* every child is position:absolute, so this box has no
    intrinsic width; a flex parent (.thumb, .row, .preset) would otherwise be
    free to shrink the real layout width toward 0 and break every left:50%
    child. The canonical 220px must stay literal - only scale() may resize it. */
  transform:scale(var(--s));transform-origin:50% 100%}
/* 52px thumbnail: 52/220, parked on the bottom of its .thumb box */
.sw.sm{position:absolute;left:50%;bottom:7px;--s:.2364;
  transform:translateX(-50%) scale(var(--s))}

/* ---------- board ---------- */
.board{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  width:210px;height:88px;border-radius:20% / 50%;
  background:linear-gradient(150deg,#D89A52 0%,#BE7A3C 55%,#A4642E 100%);
  box-shadow:0 6px 0 0 #8D5426, 0 11px 0 0 #74431C,
             0 24px 20px -8px rgba(96,48,24,.32)}
.board::after{content:"";position:absolute;top:16%;right:12%;width:3.6%;height:8%;
  border-radius:50%;background:rgba(60,30,10,.35);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.45)}

/* ---------- layer stack ---------- */
.layers{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);
  width:100%;display:flex;flex-direction:column-reverse;align-items:center}
.ly{display:none}
.ly.on{display:block}

/* ---------- THE DROP ----------
   A newly picked layer falls onto the stack, squashes flat on impact and
   settles through one small rebound. Two deliberate choices:

   1. It animates the INDEPENDENT `translate` / `scale` properties, never
      `transform`. The scattered veg and crunch pieces carry their own
      `transform: rotate()`; an animation on `transform` wins the cascade and
      would flatten every rotation for the length of the drop and, with a
      forwards fill, permanently. translate/scale compose with transform
      instead, so a tilted chip falls in still tilted.
   2. Fill is `backwards`, not `both` - the delayed pieces hold their airborne
      pose during their delay instead of flashing at rest first, and the
      element's own declared transform comes back untouched at the end. */
@keyframes drop{
  0%  {translate:0 -38px;scale:.93 1.1;animation-timing-function:cubic-bezier(.45,0,.9,.55)}
  55% {translate:0 0;scale:1.09 .72;animation-timing-function:cubic-bezier(0,0,.2,1)}
  76% {translate:0 -5px;scale:.985 1.05}
  100%{translate:0 0;scale:1}
}
/* a slab lands as one object; a scattered slot lands piece by piece, 55ms apart,
   because several things arriving in quick succession reads as food and one
   block appearing reads as a chart */
.ly.drop:not(:has(i)){animation:drop .46s var(--ease) backwards}
.ly.drop>i{animation:drop .4s var(--ease) backwards}
.ly.drop>i:nth-child(2){animation-delay:55ms}
.ly.drop>i:nth-child(3){animation-delay:110ms}
.ly.drop>i:nth-child(4){animation-delay:165ms}
.ly.drop>i:nth-child(5){animation-delay:220ms}
.ly.drop>i:nth-child(6){animation-delay:275ms}
/* the board takes the weight, timed to the impact frame at 55% of .46s */
@keyframes takeweight{0%,100%{scale:1}45%{scale:1.012 .955}}
.sw.impact .board{animation:takeweight .3s var(--ease) .2s}
/* before the first pick the board reads as waiting: a ghost of the base slice.
   ::before is the FIRST flex item of a column-reverse stack, i.e. the bottom
   one, so it lands exactly where the base bread will - same 190x40, same -26px. */
.sw.empty .layers::before{content:"";width:190px;height:40px;border-radius:50%;
  border:2px dashed var(--sage);margin-bottom:-26px}

/* generic "puck": squashed ellipse + extruded wall + soft contact shadow */
.puck{position:relative;width:var(--w);height:var(--h);border-radius:50%;
  background:radial-gradient(120% 140% at 32% 22%, var(--hi,rgba(255,255,255,.55)), transparent 60%),
             var(--fill);
  box-shadow:0 3px 0 0 var(--fill-dark), 0 6px 0 0 var(--fill-dark),
             0 9px 0 0 var(--fill-dark), 0 15px 10px -6px rgba(20,10,5,.35)}

/* ---------- bread ---------- */
.breadB{--w:190px;--h:40px;margin-bottom:-26px;z-index:1}
.breadT{--w:190px;--h:54px;margin-bottom:0;z-index:6}
.breadT::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:5px solid var(--fill-dark);opacity:.5;
  -webkit-mask:linear-gradient(#000,transparent 55%);mask:linear-gradient(#000,transparent 55%)}
.breadB.white,.breadT.white{--fill:#f1dfb8;--fill-dark:#d8bd85;--hi:rgba(255,255,255,.7)}
.breadB.multi,.breadT.multi{--fill:#a9743f;--fill-dark:#82531f;--hi:rgba(255,235,200,.35)}
.breadB.sour,.breadT.sour{--fill:#d9ad63;--fill-dark:#b0813c;--hi:rgba(255,255,255,.5)}
.breadB.pav,.breadT.pav{--fill:#f3e2be;--fill-dark:#e0c48b;--hi:rgba(255,255,255,.8)}

/* ---------- mayo (thin drizzle) ---------- */
/* 178px is wider than the 172px filling that lands on top of it, so the mayo's
   rim survives step 3 instead of being swallowed. Width is safe to change:
   only --h is coupled to the hand-tuned overlap margins. */
.mayo{--w:190px;--h:14px;margin-bottom:-11px;z-index:2}
.mayo::after{content:"";position:absolute;inset:15% 8%;border-radius:50%;opacity:.8;
  background-image:repeating-linear-gradient(115deg, var(--drizzle) 0 3px, transparent 3px 12px)}
/* original + garlic are near-white and used to vanish against cream bread and
   the cream page. Legibility beats physical accuracy: both get a distinctly
   darker --fill-dark (which drives the extrusion) plus a thin outer ring, so
   the layer always shows an edge whatever sits above or below it. */
.mayo.orig{--fill:#f4ecd2;--fill-dark:#b39a5c;--drizzle:#fffaf0}
.mayo.burger{--fill:#f0d98a;--fill-dark:#cdb163;--drizzle:#fff3c4}
.mayo.garlic{--fill:#eef2df;--fill-dark:#93a06a;--drizzle:#ffffff}
.mayo.tandoori{--fill:#e07a3f;--fill-dark:#b0551f;--drizzle:#f7a35c}
.mayo.orig,.mayo.garlic{box-shadow:
  0 3px 0 0 var(--fill-dark), 0 6px 0 0 var(--fill-dark), 0 9px 0 0 var(--fill-dark),
  0 0 0 2px rgba(70,55,20,.5), 0 15px 10px -6px rgba(20,10,5,.35)}

/* ---------- filling (thick slab) ---------- */
.fill{--w:172px;--h:32px;margin-bottom:-22px;z-index:3}
.fill.aloo{--fill:#e8c15a;--fill-dark:#bd9636;--hi:rgba(255,255,240,.5)}
.fill.paneer{--fill:#f5edd4;--fill-dark:#d7c99f;--hi:rgba(255,255,255,.7)}
.fill.chicken{--fill:#d99a56;--fill-dark:#ab6f32;--hi:rgba(255,235,200,.45)}
.fill.veggies{--fill:#d3763f;--fill-dark:#a8531f;--hi:rgba(255,220,180,.4)}

/* ---------- veg (thin, multi-select, all four share one slot) ---------- */
.vslot{position:relative;width:178px;height:20px;margin-bottom:-17px;z-index:4}
.veg{position:absolute;inset:0;z-index:1}
/* the full-width leaf paints UNDER the scattered pieces, so tomato/onion/
   cucumber still read when lettuce is on */
.veg.lettuce{z-index:0}
.veg i{position:absolute;display:block}

.veg.lettuce i{left:0;top:-3px;width:178px;height:24px;
  border-radius:62% 38% 55% 45% / 48% 55% 45% 52%;
  background:radial-gradient(120% 140% at 30% 20%, rgba(255,255,255,.4), transparent 60%),
             linear-gradient(145deg,#8bcb52,#5fa233 70%);
  box-shadow:0 3px 0 0 #3f7a22, 0 10px 8px -4px rgba(20,30,5,.35)}
.veg.lettuce i::before{content:"";position:absolute;inset:-3px;border-radius:inherit;z-index:-1;
  background:repeating-radial-gradient(circle at 50% 50%, transparent 0 6px, rgba(95,162,51,.9) 7px 8px);
  -webkit-mask:radial-gradient(closest-side, transparent 92%, #000 94%);
  mask:radial-gradient(closest-side, transparent 92%, #000 94%)}

.veg.tomato i{left:51px;top:0;width:34px;height:16px;border-radius:50%;
  background:radial-gradient(120% 140% at 30% 25%, rgba(255,255,255,.75), transparent 55%),
             radial-gradient(circle at 50% 50%, #f2a5a0 0 30%, #e2453a 32% 78%, #b52c24 80%);
  box-shadow:0 2px 0 0 #922019, 0 5px 4px -2px rgba(20,0,0,.4)}
.veg.tomato i+i{left:92px;top:4px;width:29px;height:14px}

.veg.onion i{left:95px;top:-2px;width:30px;height:12px;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%, #f4e7ef 0 2px, #d7a9c6 2px 4px);
  box-shadow:0 2px 0 0 #b787a8, 0 4px 3px -2px rgba(30,10,20,.3)}

.veg.cucumber i{left:40px;top:2px;width:26px;height:12px;border-radius:50%;
  background:radial-gradient(120% 140% at 35% 25%, rgba(255,255,255,.6), transparent 60%),
             radial-gradient(circle at 50% 50%, #cdeab0 0 55%, #6fae4c 60% 82%, #4c8a34 84%);
  box-shadow:0 2px 0 0 #3c7028, 0 4px 3px -2px rgba(10,20,0,.3)}

/* ---------- crunch (irregular/scattered, multi-select) ---------- */
.cslot{position:relative;width:150px;height:10px;margin-bottom:-8px;z-index:5}
.crunch{position:absolute;inset:0}
.crunch i{position:absolute;display:block;background:var(--fill);
  border-radius:40% 60% 55% 45% / 55% 45% 55% 45%;
  box-shadow:0 1.5px 0 0 var(--fill-dark), 0 3px 3px -1px rgba(20,10,0,.3)}

.crunch.chips i{--fill:#e8c968;--fill-dark:#bd9c3d;width:16px;height:8px}
.crunch.chips i:nth-child(1){left:20px;top:0;transform:rotate(-8deg)}
.crunch.chips i:nth-child(2){left:55px;top:4px;transform:rotate(10deg)}
.crunch.chips i:nth-child(3){left:90px;top:-2px;transform:rotate(-4deg)}
.crunch.chips i:nth-child(4){left:118px;top:3px;transform:rotate(14deg)}

.crunch.nachos i{--fill:#e0a94c;--fill-dark:#b47f2c;width:14px;height:10px;
  border-radius:20% 20% 60% 60% / 20% 20% 70% 70%}
.crunch.nachos i:nth-child(1){left:12px;top:2px;transform:rotate(20deg)}
.crunch.nachos i:nth-child(2){left:50px;top:-3px;transform:rotate(-15deg)}
.crunch.nachos i:nth-child(3){left:84px;top:3px;transform:rotate(5deg)}
.crunch.nachos i:nth-child(4){left:115px;top:-1px;transform:rotate(-25deg)}

.crunch.friedonion i{--fill:#c9852f;--fill-dark:#9c621d;width:10px;height:5px;border-radius:50%}
.crunch.friedonion i:nth-child(1){left:18px;top:3px}
.crunch.friedonion i:nth-child(2){left:40px;top:-2px}
.crunch.friedonion i:nth-child(3){left:66px;top:4px}
.crunch.friedonion i:nth-child(4){left:92px;top:-1px}
.crunch.friedonion i:nth-child(5){left:118px;top:2px}

.crunch.namkeen i{--fill:#d9b24a;--fill-dark:#ac8a2f;width:6px;height:6px;border-radius:50%}
.crunch.namkeen i:nth-child(1){left:22px;top:2px}
.crunch.namkeen i:nth-child(2){left:38px;top:-3px}
.crunch.namkeen i:nth-child(3){left:60px;top:4px}
.crunch.namkeen i:nth-child(4){left:82px;top:-2px}
.crunch.namkeen i:nth-child(5){left:100px;top:3px}
.crunch.namkeen i:nth-child(6){left:122px;top:0}

/* ============ THE TWO-PART CTA (spec S3.1) ============
   110px box so the pill can be pulled up -50px and straddle the block above.
   Pill 50px R100 terracotta; ring 40px 1px white inset 5px, pointer-events:none.
   Nobody else's buttons look like this. */
.cta{display:flex;align-items:center;justify-content:center;
     position:relative;width:100%;max-width:250px;height:110px;min-width:150px;
     border:0;background:none;padding:0;color:inherit;font:inherit;
     -webkit-appearance:none;appearance:none}
.cta .ring{position:absolute;z-index:2;pointer-events:none;
  border:1px solid var(--primary-ink);border-radius:var(--r-pill);
  width:calc(100% - 10px);height:40px;top:50%;left:50%;transform:translate(-50%,-50%)}
.cta .pill{display:block;position:relative;width:100%;height:50px;line-height:50px;text-align:center;
  background:var(--primary);color:var(--primary-ink);border-radius:var(--r-pill);
  text-transform:uppercase;font-family:var(--font-neutral);font-weight:400;
  font-size:12px;letter-spacing:1.8px;
  transition:background .15s var(--ease)}
@media (min-width:768px){.cta .pill{font-size:14px;letter-spacing:2.1px}}
@media (hover:hover){.cta:hover .pill{background:#8E4D24}}
.cta:disabled .pill{background:var(--hairline);color:var(--gray-500)}
.cta:disabled .ring{border-color:var(--gray-500)}
.cta .spin{display:inline-block;vertical-align:-3px;margin-right:6px;
  width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:99px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ctas{display:flex;flex-direction:column;align-items:center;gap:0}

/* ============ text link - the growing underline (spec S3.3).
   The system has NO outline/ghost button; this IS the secondary action.
   44px min target because we fix rather than inherit the site's a11y debt. ============ */
.tlink{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:44px;padding:0 var(--s2);border:0;background:none;color:var(--darkgray);
  font-family:var(--font-neutral);font-weight:400;font-size:16px;line-height:1;
  letter-spacing:1.6px;text-transform:uppercase}
.tlink::after{content:"";position:absolute;display:block;width:0;left:0;bottom:8px;
  border-bottom:1px solid var(--primary);transition:.5s}
.tlink:hover::after,.tlink:focus-visible::after{width:98%;left:1%}

/* ============ THE SEAL (spec S9.2) - 8-lobed mark ============ */
.seal{position:relative;width:var(--sz,54px);height:var(--sz,54px);flex:0 0 auto;
      display:flex;align-items:center;justify-content:center}
.seal svg{position:absolute;top:0;left:0;width:100%;height:100%}
.seal .disc{fill:var(--disc,var(--campaign))}
.seal .lobe{fill:none;stroke:var(--lobe,#fff);stroke-width:var(--sw,1);stroke-linejoin:round}
.seal b{position:relative;z-index:1;font-family:var(--font-primary);font-weight:700;
        color:var(--lobe,#fff);font-size:22px;line-height:1;text-align:center}
.seal.lg{--sz:84px;--sw:2}
.seal.lg b{font-size:19px;line-height:23px;letter-spacing:.5px;text-transform:uppercase}

/* mechanic: seal-numbered steps (spec S10 move 8) */
.mech{position:relative;--arcfill:var(--campaign);background:var(--campaign);color:#fff;
  padding:var(--s6) var(--s4) var(--s7);margin-top:var(--s7)}
.mech h2{color:#fff}
.mech ol{list-style:none;margin:var(--s5) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s4)}
.mech li{display:flex;align-items:center;gap:var(--s4)}
/* inside a red block the seal is line art only - the "numbered recipe step"
   variant of the mark (spec S9.2 case 1), not the filled badge. */
.mech .seal{--disc:transparent}
/* white on #ED1C24 is 4.38:1 -> legal only at >=19px/700. This is 19px/700. */
.mech li p{margin:0;font-family:var(--font-primary);font-weight:700;font-size:19px;
  line-height:26px;color:#fff;text-wrap:balance}

/* ============ CARD GRAMMAR (spec S3.6/S3.7) ============
   Image or packshot on top, warm footer below, arc on the footer's top edge,
   footer fill alternating cream/gold across the grid. Zero shadows. */
/* flex column + flex:1 on the footer so every tile in a grid row ends at the
   same baseline when one name wraps to two lines and its neighbours do not */
.opt{position:relative;border:0;background:none;padding:0;text-align:left;color:var(--darkgray);
  border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;
  transition:transform .4s var(--ease)}
/* a flat swatch carries no information beyond its colour, so it is sized to be
   recognisable and no larger: 84px, against 120px for the packshot step, whose
   jars are the one place real product art appears and do deserve the room. */
.opt .swatch{flex:0 0 auto;height:84px;border-radius:var(--r-card) var(--r-card) 0 0;position:relative;
  background:var(--swatch);display:grid;place-items:center;overflow:hidden}
.opt .swatch img{height:116px;width:auto;object-fit:contain;
  transition:transform .4s var(--ease)}
@media (hover:hover){.opt:hover .swatch img{transform:scale(.88)}}
.opt .foot{display:block;position:relative;background:var(--arcfill);padding:8px 12px 12px;
  border-radius:0 0 var(--r-card) var(--r-card);min-height:44px;flex:1 1 auto}
.opt .name{display:block;font-family:var(--font-primary);font-weight:500;font-size:20px;
  line-height:26px;letter-spacing:.6px;color:var(--darkgray)}
.opt .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:99px;
  background:var(--campaign);color:#fff;display:none;place-items:center;z-index:3}
.opt[aria-pressed=true] .tick{display:grid}
.opt[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}
.opt:active{transform:scale(.985)}

/* ============ presets - recipe-card variant, real dish photography ============ */
.presets{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--s4);
  margin:0 calc(var(--s4) * -1);padding:var(--s2) var(--s4) var(--s5);scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{scroll-snap-align:start;flex:0 0 172px;border:0;background:none;padding:0;
  border-radius:var(--r-card);overflow:hidden;text-align:left;color:var(--darkgray);
  transition:transform .12s var(--ease)}
.preset .shot{display:block;position:relative;height:120px;overflow:hidden;
  border-radius:var(--r-card) var(--r-card) 0 0;background:var(--cream)}
.preset .shot img{width:100%;height:100%;object-fit:cover;
  transition:transform .4s var(--ease)}
.preset .thumb{display:block;position:absolute;right:6px;bottom:6px;width:52px;height:52px;border-radius:10px;
  background:rgba(253,249,244,.94);overflow:hidden}
@media (hover:hover){.preset:hover .shot img{transform:scale(1.06)}}
.preset .foot{display:block;position:relative;background:var(--arcfill);padding:10px 14px 18px;min-height:76px;
  border-radius:0 0 var(--r-card) var(--r-card)}
.preset b{display:block;font-family:var(--font-primary);font-weight:500;font-size:20px;
  line-height:26px;letter-spacing:.6px}
.preset span{display:block;font-size:14px;line-height:20px;color:var(--darkgray);margin-top:2px}
.preset:active{transform:scale(.97)}
.presets .preset:nth-child(odd){--arcfill:var(--cream)}
.presets .preset:nth-child(even){--arcfill:var(--gold)}

/* ============ hero blocks ============ */
.hero{position:relative;z-index:1;background:var(--cream);overflow:hidden}
.hero img{width:100%;height:230px;object-fit:cover}
/* MEASURED: cream #EFDBB2 over this photograph, even behind a 33% scrim, is
   2.13:1 average and 1.08:1 at its worst pixel. AugustScript therefore sits on
   the campaign red field instead of on the photo - 3.22:1, and large text.
   It is still the one script line per page the spec allows (S2.4). */
.heroblock .august{margin-bottom:var(--s2)}
.heroblock{background:var(--hero-fill);color:var(--hero-ink);padding:var(--s6) var(--s4) var(--s7)}

/* ============ cards / list ============ */
.card{position:relative;background:var(--white);border-radius:var(--r-card);
  border:1px solid var(--sage);padding:var(--s5) var(--s4) var(--s5)}
.code{font-family:var(--font-neutral);font-size:14px;letter-spacing:2.1px;
  text-transform:uppercase;color:var(--darkgray)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4);justify-content:center}
.tag{background:var(--white);border:1px solid var(--sage);border-radius:var(--r-pill);
  padding:6px 14px;font-size:14px;line-height:20px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--darkgray)}
.note{background:var(--beige);border-radius:var(--r-card);
  padding:var(--s4);font-size:16px;line-height:24px;color:var(--darkgray);margin-top:var(--s4);
  display:flex;gap:var(--s3)}
.note svg{flex:0 0 auto;margin-top:3px}
.note b{font-family:var(--font-primary);font-weight:500}

.list{position:relative;background:var(--coolgray);border-radius:0 0 var(--r-card) var(--r-card);
  --arcfill:var(--coolgray);padding:var(--s2) var(--s4) var(--s4);margin-top:28px}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;
  border-bottom:1px solid var(--curve-line)}
.row:last-child{border-bottom:0}
.rank{width:26px;text-align:center;font-family:var(--font-primary);font-weight:500;font-size:20px;
  line-height:1;color:var(--gray-500)}
.row.top3 .rank{color:var(--primary)}
.thumb{position:relative;flex:0 0 52px;width:52px;height:52px;border-radius:10px;
  background:var(--white);border:1px solid var(--sage);overflow:hidden}
.who{flex:1;min-width:0}
.who b{font-family:var(--font-primary);font-weight:500;font-size:20px;line-height:26px;
  letter-spacing:.6px;color:var(--darkgray);display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who span{display:block;font-size:14px;line-height:20px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gray-500)}
.vote{min-width:56px;min-height:50px;border-radius:var(--r-pill);border:1px solid var(--primary);
  background:var(--white);color:var(--primary);padding:6px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background .15s var(--ease),border-color .15s var(--ease),transform .12s var(--ease)}
.vote .n{font-family:var(--font-neutral);font-size:14px;letter-spacing:1.4px}
@media (hover:hover){.vote:hover{background:var(--cream)}}
.vote:active:not(:disabled){transform:scale(.94)}
.vote:disabled{border-color:var(--sage);color:var(--gray-500)}
.vote.mine{background:var(--primary);border-color:var(--primary);color:#fff}

.tabs{display:flex;gap:var(--s2);background:var(--white);border:1px solid var(--sage);padding:4px;
  border-radius:var(--r-pill);margin:var(--s4) 0 0}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;border-radius:var(--r-pill);
  font-family:var(--font-neutral);font-size:12px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--gray-500);transition:background .15s var(--ease),color .15s var(--ease)}
.tabs button[aria-selected=true]{background:var(--primary);color:#fff}

/* ============ form - pill input, a documented extension (spec S11.4) ============ */
.field{margin-top:var(--s5)}
.field label{display:block;font-family:var(--font-primary);font-weight:500;font-size:20px;
  line-height:26px;margin-bottom:var(--s2)}
.field input{width:100%;min-height:52px;padding:0 var(--s5);border-radius:var(--r-pill);
  border:1px solid var(--sage);background:var(--white);
  font:400 16px var(--font-neutral);color:var(--darkgray)}
.field input::placeholder{color:var(--gray-500)}
.field input:focus{border-color:var(--primary);outline:2px solid var(--primary);outline-offset:1px}
.field input[aria-invalid=true]{border-color:var(--campaign);border-width:2px}
.help{font-size:14px;line-height:20px;color:var(--gray-500);margin:var(--s2) 0 0;padding-left:var(--s5)}
.err{font-size:14px;line-height:20px;color:#B3121A;margin:var(--s2) 0 0;padding-left:var(--s5);
  display:flex;gap:var(--s2);align-items:center}

.empty{text-align:center;padding:var(--s7) var(--s4);color:var(--gray-500)}
.empty h2{font-size:24px;line-height:30px;font-weight:500;margin-bottom:var(--s2);color:var(--darkgray)}
.center{text-align:center}
.mt5{margin-top:var(--s5)}
.meta.gap{margin-bottom:var(--s4)}
.fine{display:block;text-align:center;color:var(--gray-500);font-size:14px;line-height:20px;
  letter-spacing:1.4px;text-transform:uppercase;padding:var(--s5) var(--s4) 0}


/* ============================================================================
   THE KITCHEN — one continuously scrolling document
   ----------------------------------------------------------------------------
   Vertical scroll = progression through the recipe. Horizontal scroll = choosing
   within a step. Nothing is scroll-jacked: no wheel/touchmove listener exists in
   this file. The page RESPONDS to native scroll via scroll-snap, position:sticky
   and IntersectionObserver, and never fights it.
   ============================================================================ */

/* --barH is measured from the real header in JS (safe-area makes it variable).
   --counterH is the reserved height of the sticky worktop; every .step pads its
   own top by exactly that much, which is why the rail can never be occluded at
   the snap position. Change one and the other must follow. */
:root{ --barH:62px; --slabH:52px; --counterH:clamp(252px,38svh,340px); --cardW:172px }

html{scroll-snap-type:y proximity;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
main{padding:0 var(--s4) calc(env(safe-area-inset-bottom) + 40px)}
.opening,.starters,.howto,.step{scroll-snap-align:start;scroll-margin-top:var(--barH)}

/* ---------- the opening ---------- */
/* the one deliberate overlap on this screen (The One Overlap Rule) */
.opening .heroblock{margin-top:-38px;padding-top:var(--s6)}
/* the vertical gesture, taught once: a drip running down off the counter edge */
.cue{display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--primary);padding:var(--s6) 0 var(--s5)}
.cue .lbl{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gray-500)}
.cue .ln{width:1px;height:30px;background:var(--primary)}
@media (prefers-reduced-motion:no-preference){
  .cue svg{animation:cuedown 2.6s var(--ease) infinite}
}
@keyframes cuedown{0%,62%,100%{translate:0}78%{translate:0 6px}}

.starters,.howto{padding-top:var(--s6)}

/* ---------- the worktop ----------
   .counter is the sticky scene; .plate is the same surface, not sticky, used
   once at the finale so the handoff from the sticky sandwich to the plated one
   lands on identical geometry instead of a jump cut. */
.counter,.plate{position:relative;height:var(--counterH);
  margin-inline:calc(var(--s4) * -1);background:var(--paper)}
.counter{position:sticky;top:var(--barH);z-index:8}
.counter .air,.plate .air{position:absolute;left:0;right:0;top:0;bottom:var(--slabH);
  background:radial-gradient(54% 64% at 50% 100%, var(--beige) 0%, rgba(247,233,213,0) 72%)}
/* the worktop slab. Its top edge IS the brand arc — the counter's front lip and
   the card-footer curve are the same device, which is the whole point. */
.slab{position:absolute;left:0;right:0;bottom:0;height:var(--slabH);--arcfill:var(--cream);
  background:linear-gradient(180deg,var(--cream) 0%,var(--gold) 100%)}
.counter .sw,.plate .sw{position:absolute;left:50%;bottom:calc(var(--slabH) - 6px);
  --s:.86;transform:translateX(-50%) scale(var(--s));transform-origin:50% 100%;z-index:2}
/* progress: five tracks let into the worktop, terracotta fill (3.79:1 on cream,
   clears the 3:1 non-text threshold). Replaces the old header rail. */
.prog{position:absolute;left:0;right:0;bottom:11px;z-index:3;
  display:flex;gap:var(--s1);padding:0 var(--s5);background:none}
.prog[hidden]{display:none}

/* ---------- a step ----------
   padding-top === --counterH, so at the snap position the rail sits exactly
   below the sticky worktop. Between snap positions the outgoing rail slides up
   BEHIND the worktop, which is opaque — the scene occludes it for free. */
.step{min-height:calc(100svh - var(--barH));padding-top:var(--counterH);
  display:flex;flex-direction:column;justify-content:center}
.steph{margin:0 0 var(--s1);font-size:28px;line-height:34px}
.step .meta{margin-bottom:var(--s2)}

/* ---------- the prep tray ----------
   Full-bleed and horizontally padding-free: .rail's centring padding is
   calc(50% - --cardW/2), and that 50% resolves against the tray's content box.
   Put inline padding on the tray and every rail mis-centres. */
.tray{position:relative;margin-inline:calc(var(--s4) * -1);padding:var(--s4) 0 var(--s5);
  margin-top:var(--s5);background:var(--white);--arcfill:var(--white)}
.railwrap{position:relative}
.rail{position:relative;display:flex;gap:var(--s3);overflow-x:auto;
  scroll-snap-type:x mandatory;
  /* the whole nested-scroll contract: horizontal overscroll never chains to the
     page, and touch-action stays `auto` so the browser keeps its own axis lock —
     setting pan-x here would eat a diagonal thumb swipe's vertical component. */
  overscroll-behavior-x:contain;
  padding-inline:calc(50% - var(--cardW) / 2);
  scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .opt{flex:0 0 var(--cardW);scroll-snap-align:center;
  transform:scale(.9);transition:transform .25s var(--ease)}
.rail .opt.at{transform:scale(1)}
/* the independent `scale` property composes with the transform above instead of
   replacing it, so a press does not cancel the off-centre scale */
.rail .opt:active{scale:.97}
.rail .opt .foot{min-height:84px}
.rail .opt .swatch{height:112px}
.rail .opt .swatch img{height:104px}
.rail .opt:nth-child(odd){--arcfill:var(--cream)}
.rail .opt:nth-child(even){--arcfill:var(--gold)}
.rail .opt[aria-checked=true],.rail .opt[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}
.rail .opt[aria-checked=true] .tick{display:grid}

/* the chip: ONE component for both grammars. On a single-select step it reads
   the state that centring already committed; on a multi step it names the one
   action the card offers. Visibility, not display, so nothing reflows mid-scroll. */
.opt .chip{display:inline-flex;align-items:center;gap:5px;margin-top:6px;visibility:hidden;
  border-radius:var(--r-pill);border:1px solid var(--sage);background:var(--white);
  color:var(--darkgray);padding:3px 10px;font-family:var(--font-neutral);font-weight:400;
  font-size:12px;line-height:18px;letter-spacing:1.8px;text-transform:uppercase}
.rail .opt.at .chip,.opt[aria-pressed=true] .chip,.opt[aria-checked=true] .chip{visibility:visible}
.opt[aria-pressed=true] .chip,.opt[aria-checked=true] .chip{
  background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt .chip .ck{display:none;line-height:0}
.opt[aria-pressed=true] .chip .ck,.opt[aria-checked=true] .chip .ck{display:block}

/* themed arrow hints. Same anatomy as the vote control — white, 1px sage, 44px,
   no shadow — and they are real paging buttons, not decoration. The glyph is the
   brand's own bow with a knife tip on it, never a generic chevron. */
.nudge{position:absolute;top:50%;transform:translateY(-50%);z-index:4;
  width:44px;height:44px;border-radius:99px;padding:0;
  background:var(--white);border:1px solid var(--sage);color:var(--primary);
  display:grid;place-items:center;
  transition:background .15s var(--ease),color .15s var(--ease)}
.nudge.prev{left:4px}
.nudge.next{right:4px}
@media (hover:hover){.nudge:not(:disabled):hover{background:var(--cream)}}
.nudge:disabled{color:var(--sage);border-color:var(--hairline)}
@media (prefers-reduced-motion:no-preference){
  .railwrap:not(.touched) .nudge.next:not(:disabled){animation:swipehint 2.8s var(--ease) infinite}
}
@keyframes swipehint{0%,64%,100%{translate:0}78%{translate:5px}90%{translate:0}}
.hint{margin:var(--s4) var(--s4) 0;text-align:center;font-size:14px;line-height:20px;
  color:var(--gray-500)}

/* the beat between the last ingredient and the plate: the worktop scrolls away
   here, alone, so two sandwiches are never on screen at once */
.closing{padding:18svh var(--s4) 12svh;text-align:center}
.closing p{margin:0;font-family:var(--font-primary);font-weight:500;font-size:24px;
  line-height:30px;letter-spacing:.72px;color:var(--darkgray)}

/* ---------- the finale ---------- */
.finale{padding-bottom:var(--s7)}
.minor{font-family:var(--font-primary);font-weight:500;font-size:24px;line-height:30px;
  letter-spacing:.72px;margin:var(--s7) 0 var(--s2)}
.finale .plate .sw{--s:.86}
.fieldset{border:0;margin:0;padding:0;min-width:0}
.pillrow{display:flex;align-items:center;background:var(--white);border:1px solid var(--sage);
  border-radius:var(--r-pill);min-height:52px;padding-left:var(--s5)}
.pillrow:focus-within{border-color:var(--primary);outline:2px solid var(--primary);outline-offset:1px}
.pillrow[data-invalid=true]{border-color:var(--campaign);border-width:2px}
.pillrow .pfx{font-size:16px;color:var(--gray-500);flex:0 0 auto}
.pillrow input{flex:1;min-width:0;border:0;background:none;min-height:50px;padding:0 var(--s5) 0 var(--s2);
  font:400 16px var(--font-neutral);color:var(--darkgray)}
.pillrow input:focus{outline:none}
/* consent: 44px target, never pre-ticked (DPDP wants a real act of consent) */
.consent{display:flex;gap:var(--s3);align-items:flex-start;margin-top:var(--s5);
  padding:var(--s4);background:var(--beige);border-radius:var(--r-card)}
.consent input{flex:0 0 auto;width:24px;height:24px;margin:10px 0 0;accent-color:var(--primary)}
.consent label{font-size:16px;line-height:24px;color:var(--darkgray);min-height:44px;
  display:flex;align-items:center}
.consent[data-invalid=true]{outline:2px solid var(--campaign);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- the leaderboard, its own route ----------
   A fixed overlay under the sticky header rather than a view swap, so the story
   keeps its scroll position underneath and coming back costs nothing. */
#board{position:fixed;left:0;right:0;top:var(--barH);bottom:0;z-index:15;
  background:var(--paper);overflow-y:auto;overscroll-behavior:contain}
#board[hidden]{display:none}
#board .inner{max-width:440px;margin:0 auto;padding:var(--s5) var(--s4) calc(env(safe-area-inset-bottom) + 40px)}
/* ============ scroll reveal (spec S8.3) - 10vh rise, 50/200/400/600/800 stagger ============ */
@media (prefers-reduced-motion:no-preference){
  .rv{opacity:0;transform:translateY(10vh);will-change:opacity,transform}
  .rv.in{opacity:1;transform:none;
    transition:opacity 600ms var(--ease-out) 50ms,transform 700ms var(--ease-out)}
  .mech li,.presets .preset{transition:opacity 600ms var(--ease-out),transform 700ms var(--ease-out)}
  .mech:not(.in) li,.starters:not(.in) .preset{opacity:0;transform:translateY(10vh)}
  .mech.in li:nth-child(2),.starters.in .preset:nth-child(2){transition-delay:200ms}
  .mech.in li:nth-child(3),.starters.in .preset:nth-child(3){transition-delay:400ms}
  .mech.in li:nth-child(4),.starters.in .preset:nth-child(4){transition-delay:600ms}
  .mech.in li:nth-child(5),.starters.in .preset:nth-child(5){transition-delay:800ms}
}


/* ============ responsive — three layouts, one tree, CSS only ============ */
@media (min-width:481px){
  :root{--cardW:200px;--counterH:clamp(280px,38svh,380px);--slabH:60px}
  .app{max-width:700px}
  .hero img{height:300px}
  .counter .sw,.plate .sw{--s:.95}
  #board .inner{max-width:700px}
}
@media (min-width:1025px){

const sig=p=>[p.bread,p.mayo,p.filling,[...p.veg].sort().join('-'),[...p.crunch].sort().join('-')].join('|');

   each share one fixed-height slot and are absolutely positioned inside it;
   the pieces themselves are <i> children. */

  const L=[];
  STEPS[0].opts.forEach(o=>L.push({cls:'puck breadB '+o.id,slot:'bread',id:o.id}));
  STEPS[1].opts.forEach(o=>L.push({cls:'puck mayo '+o.id,slot:'mayo',id:o.id}));

  L.push({wrap:'cslot',kids:STEPS[4].opts.map(o=>({cls:'crunch '+o.id,slot:'crunch',id:o.id}))});

  // it needs a marker syncStack can test; the slot stays 'bread' because the
  // lid's variant is still chosen by pick.bread.
  STEPS[0].opts.forEach(o=>L.push({cls:'puck breadT '+o.id,slot:'bread',id:o.id,part:'top'}));

  reveal card and all 20+ leaderboard rows. Two optional arguments carry the

      <div class="rail" data-rail="${s.key}" role="${s.multi?'group':'radiogroup'}"
           aria-labelledby="h-${s.key}">${s.opts.map((o,j)=>optCard(s,o,j)).join('')}</div>
      <button class="nudge next" data-nudge="1" aria-label="Next option">${ICON.arcR}</button>
    </div>
    <p class="hint">${s.multi
      ? 'Swipe to browse &middot; tap the middle card to add or remove'
      : 'Swipe sideways &middot; the middle one goes on the board'}</p>
  </div>
</section>`;

const regField=(id,label,help,attrs,prefix)=>`
  <div class="field" data-f="${id}">
    <label for="${id}">${label}</label>
    ${prefix
      ? `<div class="pillrow" data-invalid="false"><span class="pfx">${prefix}</span><input id="${id}" ${attrs}></div>`
      : `<input id="${id}" ${attrs}>`}
    <p class="help" id="${id}-help">${help}</p>
  </div>`;

function story(){
  $('main').innerHTML=`
  <section class="opening" aria-labelledby="h1">

/* ============================ the rails ============================
   Horizontal scroll chooses. Three rules hold the whole thing together:

   1. The rail is a NATIVE scroller. Nothing calls preventDefault on wheel or
      touchmove anywhere in this file; the only programmatic scrolls are
      rail.scrollTo() in response to a click or an arrow key. Vertical gestures
      are never touched, so the browser's own axis lock handles the diagonal
      thumb swipe and overscroll-behavior-x:contain stops the page from panning.
   2. The centred card is PAINTED on every frame (cheap: four offset reads,
      rAF-coalesced) but COMMITTED only on settle. Settle is whichever of
      `scrollend` or a 130ms idle timer fires first; commit is idempotent, so the
      two firing together costs nothing and neither can double-drop a layer.
   3. Commit is one call site. The drop animation, the haptic and the layer
      toggle cannot drift apart because they are the same three lines. */
let counterSW,plateSW; const rails={};

const railCards=r=>[...r.children];
function centredIndex(rail){
  const mid=rail.scrollLeft+rail.clientWidth/2; let best=0,bd=Infinity;
  railCards(rail).forEach((c,i)=>{
    const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);
    if(d<bd){bd=d;best=i}
  });
  return best;
}
function markAt(rail,i){
  if(+rail.dataset.at===i) return;
  rail.dataset.at=i;
  railCards(rail).forEach((c,j)=>{
    c.classList.toggle('at',j===i);
    c.tabIndex=j===i?0:-1;                 // roving tabindex follows the scroll
  });
  const wrap=rail.parentElement;
  wrap.querySelector('.nudge.prev').disabled=i===0;
  wrap.querySelector('.nudge.next').disabled=i===rail.children.length-1;
}
function goTo(rail,i,focus){
  const n=rail.children.length; i=Math.max(0,Math.min(n-1,i));
  const el=rail.children[i];
  rail.scrollTo({left:el.offsetLeft-(rail.clientWidth-el.offsetWidth)/2,
                 behavior:reduced()?'auto':'smooth'});
  markAt(rail,i);
  if(focus) el.focus({preventScroll:true});   // preventScroll: the rail moves, the page never does
  const s=byKey[rail.dataset.rail];
  if(!s.multi) select(s.key,s.opts[i].id);    // radiogroup semantics: moving IS choosing
}
function watchRail(rail){
  let t=0,raf=0;
  const settle=()=>{
    const i=centredIndex(rail); markAt(rail,i);
    const s=byKey[rail.dataset.rail];
    if(!s.multi && rail.dataset.live==='1') select(s.key,s.opts[i].id);
  };
  rail.addEventListener('scroll',()=>{
    if(!raf) raf=requestAnimationFrame(()=>{raf=0;markAt(rail,centredIndex(rail))});
    rail.parentElement.classList.add('touched');
    clearTimeout(t); t=setTimeout(settle,130);
  },{passive:true});
  // scrollend where it exists (Chrome/Firefox/Safari 18+), the timer everywhere else
  rail.addEventListener('scrollend',()=>{clearTimeout(t);settle()});
  rail.addEventListener('keydown',e=>{
    const n=rail.children.length, i=+rail.dataset.at||0; let j=null;
    if(e.key==='ArrowRight') j=i+1; else if(e.key==='ArrowLeft') j=i-1;
    else if(e.key==='Home') j=0; else if(e.key==='End') j=n-1; else return;
    e.preventDefault();                       // a focused control's arrow keys, not the page's
    rail.parentElement.classList.add('touched');
    rail.dataset.live='1'; goTo(rail,j,true);
  });
  markAt(rail,0);
}

/* ---------- commit ---------- */
function drop(key,id){
  syncStack(counterSW,pick,key+':'+id,true);       // open-faced: the lid is the finale's payoff
  syncStack(plateSW,pick,false,false);
  counterSW.classList.remove('empty');
  setTimeout(()=>buzz(14),240);                    // one pulse per settle, on the impact frame
}
function select(key,id){
  if(pick[key]===id) return;                       // idempotent: dedupes scrollend + timer
  pick[key]=id; paintRail(key); drop(key,id);
}
function toggle(key,id){
  const a=pick[key], k=a.indexOf(id);
  if(k<0){a.push(id); paintRail(key); drop(key,id)}
  else{a.splice(k,1); paintRail(key); syncStack(counterSW,pick,false,true); syncStack(plateSW,pick,false,false)}
}
function paintRail(key){
  const s=byKey[key], rail=rails[key], v=pick[key];
  railCards(rail).forEach((c,j)=>{
    const on=s.multi?v.includes(s.opts[j].id):v===s.opts[j].id;
    c.setAttribute(s.multi?'aria-pressed':'aria-checked',on);
    if(s.multi) c.querySelector('.chip .lbl').textContent=on?'On the board':'Tap to add';
  });
}
function setProg(n){
  $('prog').innerHTML=STEPS.map((_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
}

/* ---------- which step am I in ----------
   Each .step is (100svh - header) tall, so two of them can never both clear 55%
   of the viewport: exactly one is live at any scroll position, no tie-breaking.
   Arriving at a single-select step commits whatever is centred, which is how the
   sandwich gains its base without the user having to do anything but scroll. */
function enterStep(key,entering){
  const rail=rails[key], s=byKey[key];
  if(!entering){rail.dataset.live='0';return}
  rail.dataset.live='1'; setProg(s.i+1);
  // arriving at a single-select step commits whatever is centred: the sandwich
  // gains its layer from the vertical scroll alone, and sideways scroll edits it
  if(!s.multi && !pick[s.key]) select(s.key,s.opts[centredIndex(rail)].id);
}
function watchSteps(){
  const io=new IntersectionObserver(rows=>rows.forEach(r=>
    enterStep(r.target.dataset.step,r.isIntersecting)),{threshold:.55});
  document.querySelectorAll('.step').forEach(el=>io.observe(el));
}

/* ---------- taps ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-preset],[data-nudge],.opt[data-key],[data-vote],[data-tab]');
  if(!t) return;

  const card=t.closest('.opt[data-key]');
  if(card){
    const rail=card.parentElement, s=byKey[card.dataset.key];
    rail.dataset.live='1'; rail.parentElement.classList.add('touched');
    goTo(rail,+card.dataset.j,false);          // single-select is already committed by goTo
    if(s.multi) toggle(s.key,card.dataset.id);
    return;
  }
  if(t.dataset.nudge){
    const rail=t.closest('.railwrap').querySelector('.rail');
    rail.dataset.live='1';
    return goTo(rail,(+rail.dataset.at||0)+ +t.dataset.nudge,false);
  }
  if(t.dataset.preset!==undefined) return usePreset(+t.dataset.preset);
  if(t.dataset.vote){
    if(DB.voted) return;
    const rows=DB.e; rows.find(x=>x.code===t.dataset.vote).votes++;
    DB.e=rows; DB.voted=t.dataset.vote; return renderBoard();
  }
  if(t.dataset.tab){tab=t.dataset.tab; return renderBoard()}
  switch(t.dataset.act){
    case 'submit':  return submit();
    case 'share':   return share();
    case 'restart': location.hash=''; return location.reload();
    case 'reset':
      if(!confirm('Reset prototype data? This deletes every sandwich entry, all votes, and your saved code from this browser. This cannot be undone.')) return;
      localStorage.clear(); return location.reload();
  }
});

/* A preset fills all five picks, then drives every rail to the matching card and
   rebuilds the stack in one pass ('all'), instead of five staggered drops. */
function usePreset(i){
  pick=JSON.parse(JSON.stringify(PRESETS[i].p));
  STEPS.forEach(s=>{
    const rail=rails[s.key];
    const want=s.multi?s.opts.findIndex(o=>pick[s.key].includes(o.id))
                      :s.opts.findIndex(o=>o.id===pick[s.key]);
    rail.dataset.live='0';                     // don't let the programmatic scroll re-commit
    rail.scrollTo({left:rail.children[Math.max(0,want)].offsetLeft
      -(rail.clientWidth-rail.children[0].offsetWidth)/2,behavior:'auto'});
    markAt(rail,Math.max(0,want)); paintRail(s.key);
  });
  counterSW.classList.remove('empty');
  syncStack(counterSW,pick,'all',true); syncStack(plateSW,pick,false,false);
  buzz(14);
  $('step-bread').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
}

/* ============================ the finale ============================ */
const HELP={};   // original helper text, so clearing an error restores it verbatim

function finaleCopy(){
  if(submitted) return;              // the entry is filed; the form it wrote into is gone
  // a user who jumped here with an anchor may have skipped a rail; take whatever
  // is centred rather than rendering "undefined Sandwich"
  STEPS.forEach(s=>{if(!s.multi && !pick[s.key]) select(s.key,s.opts[centredIndex(rails[s.key])].id)});
  const n=title(pick);
  $('h-fin').textContent=n;
  $('fincode').textContent=code(sig(pick),pick);
  $('sname').placeholder=n;
  $('fintags').innerHTML=[OPT['bread:'+pick.bread].n,OPT['mayo:'+pick.mayo].n+' Mayo',
    OPT['filling:'+pick.filling].n,...pick.veg.map(v=>OPT['veg:'+v].n),
    ...pick.crunch.map(c=>OPT['crunch:'+c].n)].map(t=>`<span class="tag">${t}</span>`).join('');
}
/* The lid lands here and nowhere else: the five steps run open-faced, so closing
   the sandwich is the payoff for reaching the bottom. Same 70ms upward stagger
   as before, with a beat of daylight before the top slice. */
function plate(){
  syncStack(plateSW,pick,false,false);
  if(reduced()) return;
  let last=0;
  [...plateSW.querySelectorAll('.ly.on')].forEach((el,i)=>{
    el.style.animation='none'; el.offsetHeight;
    last=i*70+(el.classList.contains('breadT')?300:0);
    el.style.animation=`drop .5s var(--ease) ${last}ms both`;
  });
  setTimeout(()=>buzz(22),last+280);
}
function watchFinale(){
  new IntersectionObserver((rows,o)=>rows.forEach(r=>{
    if(!r.isIntersecting) return;
    finaleCopy(); if(!plated){plated=true; plate()}
  }),{threshold:.2}).observe($('finale'));
}

/* ---------- inline validation ---------- */
const RULES={
  rname:v=>v.trim().length>=2||'Enter at least 2 characters so we can credit the entry.',
  rphone:v=>/^[6-9]\d{9}$/.test(v.trim())||'Enter a 10-digit Indian mobile number.',
  remail:v=>!v.trim()||/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())||'That does not look like an email address.',
  rcity:v=>v.trim().length>=2||'Enter the city you are entering from.'
};
function setErr(id,msg){
  const wrap=document.querySelector(`[data-f="${id}"]`), el=$(id),
        row=wrap.querySelector('.pillrow'), p=$(id+'-help');
  el.setAttribute('aria-invalid',msg?'true':'false');
  if(row) row.dataset.invalid=msg?'true':'false';
  p.className=msg?'err':'help';
  p.innerHTML=msg?ICON.alert+'<span>'+msg+'</span>':HELP[id];
}
function check(id){const r=RULES[id](  $(id).value); setErr(id,r===true?'':r); return r===true}
function wireValidation(){
  Object.keys(RULES).forEach(id=>{
    HELP[id]=$(id+'-help').innerHTML;
    $(id).addEventListener('blur',()=>check(id));
    // clear the moment it becomes valid, rather than on the next submit
    $(id).addEventListener('input',()=>{if($(id).getAttribute('aria-invalid')==='true') check(id)});
  });
  $('rconsent').addEventListener('change',()=>{
    if($('rconsent').checked) $('consentbox').dataset.invalid='false';
  });
  $('rphone').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'')});
}
function submit(){
  if(busy||submitted) return;
  const bad=Object.keys(RULES).filter(id=>!check(id));
  const consent=$('rconsent').checked;
  $('consentbox').dataset.invalid=consent?'false':'true';
  if(bad.length||!consent){
    const first=bad.length?$(bad[0]):$('rconsent');
    first.focus(); first.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});
    return;
  }
  busy=true;
  const btn=document.querySelector('[data-act=submit]');
  btn.disabled=true; btn.querySelector('.pill').innerHTML='<span class="spin"></span>Creating';
  setTimeout(()=>{                                  // ponytail: stands in for POST /api/entries
    const s=sig(pick), rows=DB.e, owner=rows.find(r=>r.sig===s),
          given=$('sname').value.trim();
    const entry={sig:s,pick:JSON.parse(JSON.stringify(pick)),name:given||title(pick),
      code:code(s,pick),by:'@'+$('rname').value.trim().toLowerCase().replace(/\s+/g,''),
      city:$('rcity').value.trim(),votes:0,at:Date.now(),dupeOf:owner?owner.code:null};
    rows.push(entry); DB.e=rows; DB.mine=entry.code; busy=false; submitted=true;
    confirmEntry(entry);
  },900);
}
function confirmEntry(me){
  const all=[...DB.e].sort((a,b)=>b.votes-a.votes);
  const rank=all.findIndex(r=>r.code===me.code)+1;
  $('regwrap').innerHTML=`
    <div class="card center mt5">
      <h2 tabindex="-1" id="donetitle">${me.name}</h2>
      <div class="code">${me.code}</div>
      <div class="center" style="margin-top:var(--s5);display:flex;justify-content:center">
        ${seal("You're<br>In",'lg')}</div>
    </div>
    ${me.dupeOf?`<div class="note">${ICON.info}<span><b>Someone built this exact combo first</b> (${me.dupeOf}). You still compete &mdash; the board ranks entries, not combos.</span></div>`:''}
    <div class="note">${ICON.info}<span>You are <b>#${rank}</b> of ${all.length}. The Top 20 go to the jury round.</span></div>
    <div class="ctas mt5">
      ${cta('Share It','data-act="share"')}
      <a class="tlink" href="#leaderboard">${ICON.trophy} View Leaderboard</a>
    </div>`;
  $('donetitle').focus({preventScroll:true});
  $('donetitle').scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});
}
function share(){
  const me=DB.e.find(r=>r.code===DB.mine);
  const text=`I built "${me.name}" ${me.code} for The Great Indian Sandwich. Vote for mine!`;
  if(navigator.share) navigator.share({title:'The Great Indian Sandwich',text,url:location.href}).catch(()=>{});
  else alert(text+'\n\n(On a phone this opens the native share sheet -> Instagram Stories.)');
}

/* ============================ leaderboard, its own route ============================
   A fixed overlay under the sticky header instead of a view swap: the narrative
   keeps its scroll position underneath, so coming back costs nothing and the
   browser Back button is the close button. */
function renderBoard(){
  const all=[...DB.e].sort((a,b)=>b.votes-a.votes||a.at-b.at);
  const list=tab==='top'?all.slice(0,20):all.slice(20);
  $('boardbody').innerHTML=`
    <p class="center" style="margin:0 0 var(--s3)"><a class="tlink" href="#">${ICON.back} Back to the kitchen</a></p>
    <h1 id="boardh" tabindex="-1">India's Leaderboard</h1>
    <p class="meta">${all.length} entries &middot; one vote per person</p>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab==='top'}" data-tab="top">Top 20</button>
      <button role="tab" aria-selected="${tab==='rest'}" data-tab="rest">Everyone else</button>
    </div>
    <div class="list">${ARC}${ list.length ? list.map((r,i)=>{
      const rk=tab==='top'?i+1:i+21, mine=DB.voted===r.code, spent=!!DB.voted;
      return `<div class="row ${rk<4?'top3':''}">
        <div class="rank">${rk}</div>
        <div class="thumb">${stackHTML('sm')}</div>
        <div class="who"><b>${r.name}</b><span>${r.by} &middot; ${r.code}</span></div>
        <button class="vote ${mine?'mine':''}" data-vote="${r.code}" ${spent?'disabled':''}
          aria-label="${mine?'You voted for':'Vote for'} ${r.name}. ${r.votes} votes">
          ${mine?ICON.check:ICON.up}<span class="n">${r.votes}</span></button>
      </div>`}).join('')
      : `<div class="empty"><h2>Nothing back here yet</h2><p class="sub">Every entry so far is in the Top 20.</p></div>`}
    </div>
    ${DB.voted?`<div class="note">${ICON.info}<span>Your one vote is spent. A real build binds this to a verified phone number, not this browser.</span></div>`:''}
    <div class="ctas mt5">
      ${cta('Build Another','data-act="restart"')}
      <button class="tlink" data-act="reset">Reset prototype data</button>
    </div>`;
  document.querySelectorAll('#board .row').forEach((row,i)=>syncStack(row.querySelector('.sw'),list[i].pick,false));
}
function route(){
  const open=location.hash==='#leaderboard';
  $('board').hidden=!open;
  $('story').inert=open;                  // focus can never wander behind the overlay
  if(!open) return;
  renderBoard(); $('board').scrollTop=0; $('boardh').focus({preventScroll:true});
}

/* ============================ boot ============================ */
story();
counterSW=document.querySelector('.counter .sw');
plateSW=document.querySelector('.plate .sw');
STEPS.forEach(s=>{rails[s.key]=document.querySelector(`[data-rail="${s.key}"]`); watchRail(rails[s.key])});
setProg(0); watchSteps(); watchFinale(); wireValidation();
// the header's height moves with the safe-area inset and with font swap, and both
// the sticky offset and every step's scroll-margin are derived from it
const setBarH=()=>document.documentElement.style.setProperty('--barH',$('bar').offsetHeight+'px');
setBarH();                                         // synchronous, before first scroll
new ResizeObserver(setBarH).observe($('bar'));     // then keep it honest
addEventListener('hashchange',route); route();
</script>
</body>
</html>
