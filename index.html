<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ED1C24">
<title>The Great Indian Sandwich</title>
<link rel="preload" href="fonts/MomentsText-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/MomentsDisplay-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="loader.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="finale.css">
</head>
<body>
<!-- entry loader: removed from the DOM by loader.js once fonts + hero are ready -->
<div id="ldr" role="status" aria-label="Loading The Great Indian Sandwich">
  <img src="assets/dr-oetker-logo.webp" width="88" height="58" alt="Dr. Oetker" fetchpriority="high">
  <h1>The Great Indian Sandwich</h1>
  <div class="ldstage" aria-hidden="true">
    <div class="ldsh"></div>
    <div class="ldsw">
      <div class="ldp b1"></div>
      <div class="ldp my"></div>
      <div class="ldp fl"></div>
      <div class="ldlf"></div>
      <div class="ldp b2"></div>
    </div>
  </div>
</div>
<!-- THE CURVE, deployment (c): objectBoundingBox clip paths, verbatim from oetker.in <defs>.
     Mobile and desktop variants; the class swaps id at 768px (spec S9.1c). -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
 <defs>
  <clipPath id="curve-mask-bottom-mobile" clipPathUnits="objectBoundingBox">
   <path d="M 0 0 H 1.0047 v 0.93 C 1.0047 0.93 0.7374 0.98 0.506 0.98 C 0.2673 0.98 0 0.93 0 0.93 V 0"/>
  </clipPath>
  <clipPath id="curve-mask-bottom-desktop" clipPathUnits="objectBoundingBox">
   <path d="M 0 0 H 1 V 0.84 C 1 0.84 0.771 1 0.5 1 C 0.226 1 0 0.84 0 0.84 V 0"/>
  </clipPath>
 </defs>
</svg>

<div class="app gis" id="story">
  <header class="bar" id="bar">
    <img src="assets/dr-oetker-logo.webp" width="78" height="51" alt="Dr. Oetker" fetchpriority="high">
    <b>The Great Indian Sandwich</b>
  </header>
  <main id="main"></main>
</div>

<script src="loader.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
